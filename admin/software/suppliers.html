<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>
  <div class="sw-header">
    <div class="sw-logo"><img src="images/suppliers.png" onerror="this.style.display='none'" style="width:24px; margin-right:8px;">Suppliers</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-content" style="padding-top: 20px;">
    <h1 class="page-title">Supplier Management</h1>

    <div class="form-card">
      <h3 class="form-card-title">Add Supplier</h3>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Name *</label><input type="text" id="supName" class="form-input" placeholder="Supplier Name"></div>
        <div class="form-group"><label class="form-label">Phone *</label><input type="tel" id="supPhone" class="form-input" placeholder="03XXXXXXXXX"></div>
      </div>
      <div class="form-group"><label class="form-label">Address</label><input type="text" id="supAddress" class="form-input" placeholder="Address"></div>
      <div class="form-group">
        <label class="form-label">Supplier Photo</label>
        <input type="file" id="supPhoto" class="form-input" accept="image/*" style="padding:10px;">
        <div id="supPhotoPreview" style="margin-top:10px;"></div>
      </div>
      <button class="btn-primary" onclick="saveSupplier()" style="width:100%;">Save Supplier</button>
    </div>

    <h2 class="section-title">All Suppliers</h2>
    <div class="data-list" id="suppliersList"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let supPhotoUrl = null;

    document.getElementById('supPhoto')?.addEventListener('change', (e) => {
      if (e.target.files[0]) document.getElementById('supPhotoPreview').innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:100px; border-radius:8px;">`;
    });

    async function saveSupplier() {
      const name = document.getElementById('supName').value.trim();
      const phone = document.getElementById('supPhone').value.trim();
      if (!name || !phone) { alert('❌ Name and phone required'); return; }

      const btn = event.target;
      btn.textContent = 'Saving...'; btn.disabled = true;

      try {
        if (document.getElementById('supPhoto').files[0]) {
          supPhotoUrl = await uploadImage(document.getElementById('supPhoto').files[0]);
        }

        await addRecord('suppliers', {
          name, phone,
          address: document.getElementById('supAddress').value.trim(),
          photo: supPhotoUrl
        });

        alert('✅ Supplier saved!');
        clearForm(); loadSuppliers();
      } catch (e) {
        alert('❌ ' + e.message);
      } finally {
        btn.textContent = 'Save Supplier'; btn.disabled = false;
      }
    }

    function clearForm() {
      ['supName','supPhone','supAddress'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('supPhoto').value = '';
      document.getElementById('supPhotoPreview').innerHTML = '';
      supPhotoUrl = null;
    }

    async function loadSuppliers() {
      const suppliers = await getAllRecords('suppliers') || [];
      const purchases = await getAllRecords('purchases') || [];
      const container = document.getElementById('suppliersList');
      
      if (suppliers.length === 0) { container.innerHTML = '<div class="empty-state"><p>No suppliers yet</p></div>'; return; }

      container.innerHTML = suppliers.map(s => {
        // Calculate Balance / Advance
        const sPurchases = purchases.filter(p => p.supplier_name.toLowerCase() === s.name.toLowerCase() || p.supplier_phone === s.phone);
        let balance = 0;
        let advance = 0;
        sPurchases.forEach(p => {
          if (p.balance > 0) balance += Number(p.balance);
          if (p.paid > p.total) advance += (Number(p.paid) - Number(p.total));
        });
        
        let balanceHtml = '';
        if (balance > 0) balanceHtml = `<span style="color:#FCA5A5;">Payable: ${formatPKR(balance)}</span>`;
        else if (advance > 0) balanceHtml = `<span style="color:#86EFAC;">Adv: ${formatPKR(advance)}</span>`;
        else balanceHtml = `<span style="color:#B8B8B8;">Clear</span>`;

        return `
        <div class="data-item">
          <div style="display:flex; gap:15px; align-items:center;">
            ${s.photo ? `<img src="${s.photo}" style="width:50px; height:50px; border-radius:50%; border:2px solid #FFD700; object-fit:cover;">` : `<img src="images/placeholder.png" onerror="this.style.display='none'" style="width:50px; height:50px; border-radius:50%;">`}
            <div>
              <div class="data-item-title">${s.name}</div>
              <div class="data-item-sub">📞 ${s.phone}</div>
            </div>
          </div>
          <div style="text-align:right;">
            <div class="data-item-value" style="font-size:0.9rem;">${balanceHtml}</div>
          </div>
        </div>
        `;
      }).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => { await initDB(); loadSuppliers(); });
  </script>
</body>
</html>
