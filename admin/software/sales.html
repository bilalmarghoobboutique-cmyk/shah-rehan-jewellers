<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">💰 Sales</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-nav">
    <button class="nav-btn" onclick="navigate('index.html')">🏠 Dashboard</button>
    <button class="nav-btn" onclick="navigate('purchase.html')">🛒 Purchase</button>
    <button class="nav-btn" onclick="navigate('services.html')">🔧 Services</button>
    <button class="nav-btn" onclick="navigate('store.html')">🏪 Store</button>
    <button class="nav-btn active">💰 Sales</button>
    <button class="nav-btn" onclick="navigate('customers.html')">👥 Customers</button>
    <button class="nav-btn" onclick="navigate('reports.html')">📊 Reports</button>
    <button class="nav-btn" onclick="navigate('settings.html')">⚙️ Settings</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">New Sale</h1>
    <p class="page-subtitle">Create sale and generate professional invoice</p>

    <div class="category-tabs">
      <button class="cat-tab gold active" onclick="switchCat('gold', this)">👑 Gold</button>
      <button class="cat-tab silver" onclick="switchCat('silver', this)">💍 Silver</button>
      <button class="cat-tab diamond" onclick="switchCat('diamond', this)">💎 Diamond</button>
      <button class="cat-tab artificial" onclick="switchCat('artificial', this)">✨ Artificial</button>
    </div>

    <div class="form-card">
      <h3 class="form-card-title">👤 Customer Info</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Customer Name *</label>
          <input type="text" id="cName" class="form-input" placeholder="Customer name">
        </div>
        <div class="form-group">
          <label class="form-label">Phone</label>
          <input type="tel" id="cPhone" class="form-input" placeholder="03XXXXXXXXX">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Address</label>
        <input type="text" id="cAddress" class="form-input" placeholder="City / Area">
      </div>
    </div>

    <div class="form-card">
      <h3 class="form-card-title" id="itemTitle">👑 Item Details</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Item Description *</label>
          <input type="text" id="sItem" class="form-input" placeholder="e.g., Gold Ring 22K">
        </div>
        <div class="form-group" id="karatGroup">
          <label class="form-label">Karat</label>
          <select id="sKarat" class="form-select">
            <option value="24K">24K</option>
            <option value="22K" selected>22K</option>
            <option value="21K">21K</option>
            <option value="18K">18K</option>
            <option value="16K">16K</option>
            <option value="14K">14K</option>
            <option value="12K">12K</option>
            <option value="10K">10K</option>
            <option value="8K">8K</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Weight (grams) *</label>
          <input type="number" id="sWeight" class="form-input" step="0.001" placeholder="0.000">
        </div>
        <div class="form-group">
          <label class="form-label">Rate/gram (Rs) *</label>
          <input type="number" id="sRate" class="form-input" placeholder="0">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Making Charges (Rs)</label>
          <input type="number" id="sMaking" class="form-input" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Polish Charges (Rs)</label>
          <input type="number" id="sPolish" class="form-input" placeholder="0">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">GST %</label>
          <input type="number" id="sGST" class="form-input" value="3" step="0.1">
        </div>
        <div class="form-group">
          <label class="form-label">Discount (Rs)</label>
          <input type="number" id="sDiscount" class="form-input" placeholder="0">
        </div>
      </div>
    </div>

    <div class="form-card" style="background: linear-gradient(135deg, #1C1C1C, #2A2A2A); border-color: #FFD700;">
      <h3 class="form-card-title">📊 Total Calculation</h3>
      
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
        <span>Metal Value:</span>
        <strong id="calMetal" style="color: #FFF8DC;">Rs 0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
        <span>Making + Polish:</span>
        <strong id="calMaking" style="color: #FFF8DC;">Rs 0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
        <span>Subtotal:</span>
        <strong id="calSubtotal" style="color: #FFF8DC;">Rs 0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
        <span>GST:</span>
        <strong id="calGST" style="color: #FFF8DC;">Rs 0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
        <span>Discount:</span>
        <strong id="calDiscount" style="color: #FCA5A5;">Rs 0</strong>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 15px 0; border-top: 2px solid #FFD700; margin-top: 10px; font-size: 1.3rem;">
        <span style="color: #FFD700; font-weight: 700;">TOTAL:</span>
        <strong id="calTotal" style="color: #FFD700; font-family: 'Playfair Display', serif;">Rs 0</strong>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Payment Mode</label>
        <select id="sPayment" class="form-select">
          <option value="cash">Cash</option>
          <option value="easypaisa">Easypaisa</option>
          <option value="bank">Bank Transfer</option>
          <option value="credit">Credit (Udhaar)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Amount Paid (Rs)</label>
        <input type="number" id="sPaid" class="form-input" placeholder="0">
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Remaining (Rs)</label>
        <input type="number" id="sRemaining" class="form-input" readonly style="background: #2A2A2A; color: #FCD34D; font-weight: 700;">
      </div>
      <div class="form-group">
        <label class="form-label">Notes</label>
        <input type="text" id="sNotes" class="form-input" placeholder="Optional notes">
      </div>
    </div>

    <div style="display: flex; gap: 12px; margin-top: 20px;">
      <button class="btn-primary" onclick="saveSale()" style="flex: 1;">💾 Save & Generate Invoice</button>
      <button class="btn-secondary" onclick="clearAll()" style="flex: 0 0 120px;">Clear</button>
    </div>
  </div>

  <!-- Invoice Preview Modal -->
  <div id="invoiceModal" class="modal">
    <div class="modal-content" style="max-width: 900px;">
      <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h2 class="modal-title" style="margin: 0;">📄 Invoice Preview</h2>
        <button onclick="closeInvoice()" style="background: none; border: none; color: #FFD700; font-size: 1.5rem; cursor: pointer;">×</button>
      </div>

      <div id="invoiceContent" class="invoice-container">
        <!-- Invoice content will be generated here -->
      </div>

      <div class="no-print" style="display: flex; gap: 12px; margin-top: 20px;">
        <button class="btn-primary" onclick="printInvoice()" style="flex: 1;">🖨️ Print Invoice</button>
        <button class="btn-secondary" onclick="closeInvoice()" style="flex: 1;">Close</button>
      </div>
    </div>
  </div>

  <h2 class="section-title">📋 Recent Sales</h2>
  <div class="data-list" id="salesList">
    <div class="empty-state">
      <div class="icon">💰</div>
      <p>No sales yet</p>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentCat = 'gold';
    let lastSaleId = null;

    function switchCat(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');

      const titles = {
        gold: '👑 Gold Item Details',
        silver: '💍 Silver Item Details',
        diamond: '💎 Diamond Item Details',
        artificial: '✨ Artificial Item Details'
      };
      document.getElementById('itemTitle').textContent = titles[cat];

      const karatGroup = document.getElementById('karatGroup');
      karatGroup.style.display = (cat === 'artificial') ? 'none' : 'block';

      autoCalc();
    }

    function autoCalc() {
      const weight = parseFloat(document.getElementById('sWeight').value) || 0;
      const rate = parseFloat(document.getElementById('sRate').value) || 0;
      const making = parseFloat(document.getElementById('sMaking').value) || 0;
      const polish = parseFloat(document.getElementById('sPolish').value) || 0;
      const gstPct = parseFloat(document.getElementById('sGST').value) || 0;
      const discount = parseFloat(document.getElementById('sDiscount').value) || 0;

      const metal = weight * rate;
      const makingTotal = making + polish;
      const subtotal = metal + makingTotal;
      const gst = subtotal * (gstPct / 100);
      const total = subtotal + gst - discount;

      document.getElementById('calMetal').textContent = formatPKR(metal);
      document.getElementById('calMaking').textContent = formatPKR(makingTotal);
      document.getElementById('calSubtotal').textContent = formatPKR(subtotal);
      document.getElementById('calGST').textContent = formatPKR(gst);
      document.getElementById('calDiscount').textContent = formatPKR(discount);
      document.getElementById('calTotal').textContent = formatPKR(total);

      // Auto-fill remaining
      const paid = parseFloat(document.getElementById('sPaid').value) || 0;
      const remaining = Math.max(0, total - paid);
      document.getElementById('sRemaining').value = Math.round(remaining);
    }

    ['sWeight', 'sRate', 'sMaking', 'sPolish', 'sGST', 'sDiscount', 'sPaid'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', autoCalc);
    });

    async function saveSale() {
      const customer = document.getElementById('cName').value.trim();
      const item = document.getElementById('sItem').value.trim();
      const total = parseFloat(document.getElementById('calTotal').textContent.replace(/[^0-9]/g, '')) || 0;

      if (!customer || !item || total <= 0) {
        alert('❌ Please fill customer name, item, and valid amounts');
        return;
      }

      const sale = {
        category: currentCat,
        customer_name: customer,
        customer_phone: document.getElementById('cPhone').value.trim(),
        customer_address: document.getElementById('cAddress').value.trim(),
        items_summary: item,
        karat: document.getElementById('sKarat').value,
        weight: parseFloat(document.getElementById('sWeight').value) || 0,
        rate: parseFloat(document.getElementById('sRate').value) || 0,
        making: parseFloat(document.getElementById('sMaking').value) || 0,
        polish: parseFloat(document.getElementById('sPolish').value) || 0,
        gst_pct: parseFloat(document.getElementById('sGST').value) || 0,
        discount: parseFloat(document.getElementById('sDiscount').value) || 0,
        total: total,
        payment_mode: document.getElementById('sPayment').value,
        paid: parseFloat(document.getElementById('sPaid').value) || 0,
        remaining: parseFloat(document.getElementById('sRemaining').value) || 0,
        notes: document.getElementById('sNotes').value.trim(),
        invoice_number: generateInvoiceNumber(),
        date: new Date().toISOString()
      };

      try {
        lastSaleId = await addRecord('sales', sale);
        sale.id = lastSaleId;
        showInvoice(sale);
        loadSales();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    function showInvoice(sale) {
      const invoiceNumber = sale.invoice_number;
      const date = new Date(sale.date).toLocaleDateString('en-PK', {
        day: '2-digit', month: 'long', year: 'numeric'
      });

      const html = `
        <div class="invoice-header">
          <div>
            <div class="invoice-shop-name">SHAH REHAN JEWELLERS</div>
            <div class="invoice-shop-info">
              Main Bazar #2, Ghaziabad, Lahore Cantt<br>
              📞 0092 326 6501314<br>
              ✉️ shahrehanjewellers@google.com
            </div>
          </div>
          <div class="invoice-number">
            <div class="label">Invoice #</div>
            <div class="value">${invoiceNumber}</div>
            <div style="font-size: 0.8rem; color: #666; margin-top: 5px;">${date}</div>
          </div>
        </div>

        <div class="invoice-details">
          <div>
            <div class="section-title">Bill To:</div>
            <p><strong>${sale.customer_name}</strong></p>
            ${sale.customer_phone ? `<p>📞 ${sale.customer_phone}</p>` : ''}
            ${sale.customer_address ? `<p>${sale.customer_address}</p>` : ''}
          </div>
          <div>
            <div class="section-title">Payment:</div>
            <p>Mode: ${sale.payment_mode.toUpperCase()}</p>
            <p>Paid: Rs ${sale.paid.toLocaleString()}</p>
            ${sale.remaining > 0 ? `<p style="color: #DC2626;">Remaining: Rs ${sale.remaining.toLocaleString()}</p>` : '<p style="color: #25D366;">Fully Paid ✓</p>'}
          </div>
        </div>

        <table class="invoice-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Description</th>
              <th>Karat</th>
              <th>Weight</th>
              <th>Rate</th>
              <th style="text-align: right;">Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>1</td>
              <td>${sale.items_summary}</td>
              <td>${sale.karat || '—'}</td>
              <td>${sale.weight}g</td>
              <td>Rs ${sale.rate.toLocaleString()}</td>
              <td style="text-align: right;">Rs ${(sale.weight * sale.rate).toLocaleString()}</td>
            </tr>
          </tbody>
        </table>

        <div class="invoice-totals">
          <div class="invoice-totals-inner">
            <div class="invoice-total-row">
              <span>Metal Value:</span>
              <span>Rs ${(sale.weight * sale.rate).toLocaleString()}</span>
            </div>
            <div class="invoice-total-row">
              <span>Making + Polish:</span>
              <span>Rs ${(sale.making + sale.polish).toLocaleString()}</span>
            </div>
            <div class="invoice-total-row">
              <span>Subtotal:</span>
              <span>Rs ${((sale.weight * sale.rate) + sale.making + sale.polish).toLocaleString()}</span>
            </div>
            <div class="invoice-total-row">
              <span>GST (${sale.gst_pct}%):</span>
              <span>Rs ${Math.round(((sale.weight * sale.rate) + sale.making + sale.polish) * sale.gst_pct / 100).toLocaleString()}</span>
            </div>
            ${sale.discount > 0 ? `
            <div class="invoice-total-row">
              <span>Discount:</span>
              <span style="color: #DC2626;">- Rs ${sale.discount.toLocaleString()}</span>
            </div>
            ` : ''}
            <div class="invoice-total-row grand">
              <span>GRAND TOTAL:</span>
              <span>Rs ${sale.total.toLocaleString()}</span>
            </div>
          </div>
        </div>

        ${sale.notes ? `<div style="margin-top: 15px; padding: 12px; background: #FAF7F0; border-radius: 6px; font-size: 0.85rem;"><strong>Notes:</strong> ${sale.notes}</div>` : ''}

        <div class="invoice-footer">
          <p><strong>Thank you for shopping with SHAH REHAN JEWELLERS</strong></p>
          <p style="margin-top: 5px;">For any queries, contact us at 0092 326 6501314</p>

          <div class="invoice-taglines">
            آپ کا آرڈر رازداری کے ساتھ آپ تک پہنچایا جائے گا<br>
            آخر میں آپ کا اعتماد، ہماری ضمانت
          </div>

          <p class="invoice-creator">Designed by Bilal Marghoob Creations | 0092 326 69501314</p>
        </div>
      `;

      document.getElementById('invoiceContent').innerHTML = html;
      document.getElementById('invoiceModal').classList.add('active');
    }

    function closeInvoice() {
      document.getElementById('invoiceModal').classList.remove('active');
      clearAll();
    }

    function printInvoice() {
      window.print();
    }

    function clearAll() {
      ['cName', 'cPhone', 'cAddress', 'sItem', 'sWeight', 'sRate', 'sMaking', 'sPolish', 'sDiscount', 'sPaid', 'sRemaining', 'sNotes'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('sGST').value = '3';
      autoCalc();
    }

    async function loadSales() {
      const sales = await getAllRecords('sales') || [];
      const container = document.getElementById('salesList');

      if (sales.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">💰</div><p>No sales yet</p></div>';
        return;
      }

      const catIcons = { gold: '👑', silver: '💍', diamond: '💎', artificial: '✨' };

      container.innerHTML = sales.slice(-20).reverse().map(s => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${catIcons[s.category] || '💰'} ${s.items_summary}</div>
            <div class="data-item-sub">
              ${s.customer_name} • ${s.invoice_number} • ${formatDate(s.date)}
            </div>
            <div class="data-item-actions">
              <button class="btn-icon print" onclick='reprintInvoice(${JSON.stringify(s).replace(/'/g, "&#39;")})'>🖨️ Print</button>
              <button class="btn-icon delete" onclick="deleteSale(${s.id})">🗑️ Delete</button>
            </div>
          </div>
          <div style="text-align: right;">
            <div class="data-item-value">${formatPKR(s.total)}</div>
            ${s.remaining > 0 ? `<div class="data-item-sub" style="color: #FCD34D;">Due: ${formatPKR(s.remaining)}</div>` : '<div class="data-item-sub" style="color: #86EFAC;">Paid ✓</div>'}
          </div>
        </div>
      `).join('');
    }

    function reprintInvoice(sale) {
      showInvoice(sale);
    }

    async function deleteSale(id) {
      if (!confirm('Delete this sale?')) return;
      await deleteRecord('sales', id);
      loadSales();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadSales();
    });
  </script>

</body>
</html>
