<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">🔧 Karigar Services</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-nav">
    <button class="nav-btn" onclick="navigate('index.html')">🏠 Dashboard</button>
    <button class="nav-btn" onclick="navigate('purchase.html')">🛒 Purchase</button>
    <button class="nav-btn active">🔧 Services</button>
    <button class="nav-btn" onclick="navigate('store.html')">🏪 Store</button>
    <button class="nav-btn" onclick="navigate('sales.html')">💰 Sales</button>
    <button class="nav-btn" onclick="navigate('customers.html')">👥 Customers</button>
    <button class="nav-btn" onclick="navigate('suppliers.html')">📦 Suppliers</button>
    <button class="nav-btn" onclick="navigate('expenses.html')">💵 Expenses</button>
    <button class="nav-btn" onclick="navigate('reports.html')">📊 Reports</button>
    <button class="nav-btn" onclick="navigate('settings.html')">⚙️ Settings</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Karigar Services</h1>
    <p class="page-subtitle">Manage karigars with contact info and receipts</p>

    <div class="form-card">
      <h3 class="form-card-title">➕ Add Karigar / Service</h3>
      
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Karigar Name *</label>
          <input type="text" id="kName" class="form-input" placeholder="Karigar name">
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number *</label>
          <input type="tel" id="kPhone" class="form-input" placeholder="03XXXXXXXXX">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Address</label>
        <input type="text" id="kAddress" class="form-input" placeholder="Full address">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Service Type</label>
          <select id="kType" class="form-select">
            <option value="making">Jewelry Making (Banwana)</option>
            <option value="repair">Repair (Maramat)</option>
            <option value="polish">Polish</option>
            <option value="setting">Stone Setting</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Item Description *</label>
          <input type="text" id="kItem" class="form-input" placeholder="e.g., Gold Ring 22K">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Gold Given (grams)</label>
          <input type="number" id="kGoldGiven" class="form-input" step="0.001" placeholder="0.000">
        </div>
        <div class="form-group">
          <label class="form-label">Gold Returned (grams)</label>
          <input type="number" id="kGoldReturned" class="form-input" step="0.001" placeholder="0.000">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Service Charges (Rs)</label>
          <input type="number" id="kCharges" class="form-input" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Amount Paid to Karigar (Rs)</label>
          <input type="number" id="kPaid" class="form-input" placeholder="0">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Expected Delivery</label>
          <input type="date" id="kDelivery" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Status</label>
          <select id="kStatus" class="form-select">
            <option value="pending">Pending</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="delivered">Delivered</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">📷 Karigar Photo / ID (Upload from mobile or desktop)</label>
        <input type="file" id="kPhoto" class="form-input" accept="image/*" capture="environment" style="padding: 10px;">
        <div id="kPhotoPreview" style="margin-top: 10px;"></div>
      </div>

      <div class="form-group">
        <label class="form-label">🧾 Receipt / Bill Image</label>
        <input type="file" id="kReceipt" class="form-input" accept="image/*" capture="environment" style="padding: 10px;">
        <div id="kReceiptPreview" style="margin-top: 10px;"></div>
      </div>

      <button class="btn-primary" onclick="saveService()" style="width: 100%;">💾 Save Service</button>
    </div>

    <h2 class="section-title">📋 Service Records</h2>
    <div class="data-list" id="servicesList">
      <div class="empty-state">
        <div class="icon">🔧</div>
        <p>No services yet</p>
      </div>
    </div>
  </div>

  <div id="viewModal" class="modal">
    <div class="modal-content">
      <h2 class="modal-title">Service Details</h2>
      <div id="viewContent"></div>
      <button class="btn-secondary" onclick="closeViewModal()" style="width: 100%; margin-top: 20px;">Close</button>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentPhoto = null;
    let currentReceipt = null;

    document.getElementById('kPhoto')?.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        currentPhoto = await fileToBase64(file);
        document.getElementById('kPhotoPreview').innerHTML = 
          `<img src="${currentPhoto}" style="max-width: 200px; border-radius: 8px; border: 2px solid #FFD700;">`;
      }
    });

    document.getElementById('kReceipt')?.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (file) {
        currentReceipt = await fileToBase64(file);
        document.getElementById('kReceiptPreview').innerHTML = 
          `<img src="${currentReceipt}" style="max-width: 200px; border-radius: 8px; border: 2px solid #FFD700;">`;
      }
    });

    async function saveService() {
      const name = document.getElementById('kName').value.trim();
      const phone = document.getElementById('kPhone').value.trim();
      const item = document.getElementById('kItem').value.trim();

      if (!name || !phone || !item) {
        alert('❌ Name, phone, and item are required');
        return;
      }

      const service = {
        karigar_name: name,
        karigar_phone: phone,
        karigar_address: document.getElementById('kAddress').value.trim(),
        type: document.getElementById('kType').value,
        item: item,
        gold_given: parseFloat(document.getElementById('kGoldGiven').value) || 0,
        gold_returned: parseFloat(document.getElementById('kGoldReturned').value) || 0,
        charges: parseFloat(document.getElementById('kCharges').value) || 0,
        paid: parseFloat(document.getElementById('kPaid').value) || 0,
        delivery: document.getElementById('kDelivery').value,
        status: document.getElementById('kStatus').value,
        photo: currentPhoto,
        receipt: currentReceipt,
        date: new Date().toISOString()
      };

      try {
        await addRecord('services', service);
        alert('✅ Service saved!');
        clearForm();
        loadServices();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      }
    }

    function clearForm() {
      ['kName', 'kPhone', 'kAddress', 'kItem', 'kGoldGiven', 'kGoldReturned', 'kCharges', 'kPaid', 'kDelivery'].forEach(id => {
        document.getElementById(id).value = '';
      });
      document.getElementById('kPhoto').value = '';
      document.getElementById('kReceipt').value = '';
      document.getElementById('kPhotoPreview').innerHTML = '';
      document.getElementById('kReceiptPreview').innerHTML = '';
      currentPhoto = null;
      currentReceipt = null;
    }

    async function loadServices() {
      const services = await getAllRecords('services') || [];
      const container = document.getElementById('servicesList');

      if (services.length === 0) {
        container.innerHTML = '<div class="empty-state"><div class="icon">🔧</div><p>No services yet</p></div>';
        return;
      }

      const statusColors = {
        'pending': '#FCD34D',
        'in-progress': '#93C5FD',
        'completed': '#86EFAC',
        'delivered': '#4ADE80'
      };

      container.innerHTML = services.slice().reverse().map(s => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${s.item}</div>
            <div class="data-item-sub">
              🔧 ${s.karigar_name} • 📞 ${s.karigar_phone}<br>
              ${s.type} • 
              <span style="color: ${statusColors[s.status] || '#FCD34D'}">${s.status.toUpperCase()}</span>
            </div>
            <div class="data-item-sub">Gold: ${s.gold_given || 0}g → ${s.gold_returned || 0}g</div>
            <div class="data-item-actions">
              <button class="btn-icon edit" onclick='viewService(${JSON.stringify(s).replace(/'/g, "&#39;")})'>👁️ View</button>
              <button class="btn-icon delete" onclick="deleteService(${s.id})">🗑️ Delete</button>
            </div>
          </div>
          <div style="text-align: right;">
            <div class="data-item-value">${formatPKR(s.charges)}</div>
            <div class="data-item-sub">Paid: ${formatPKR(s.paid)}</div>
          </div>
        </div>
      `).join('');
    }

    function viewService(s) {
      const html = `
        <div style="padding: 15px 0;">
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
            <span style="color: #B8B8B8;">Karigar:</span>
            <strong style="color: #FFD700;">${s.karigar_name}</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
            <span style="color: #B8B8B8;">Phone:</span>
            <strong>${s.karigar_phone}</strong>
          </div>
          ${s.karigar_address ? `
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
            <span style="color: #B8B8B8;">Address:</span>
            <strong>${s.karigar_address}</strong>
          </div>` : ''}
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
            <span style="color: #B8B8B8;">Service:</span>
            <strong>${s.type}</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
            <span style="color: #B8B8B8;">Item:</span>
            <strong>${s.item}</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
            <span style="color: #B8B8B8;">Charges:</span>
            <strong>${formatPKR(s.charges)}</strong>
          </div>
          <div style="display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
            <span style="color: #B8B8B8;">Paid:</span>
            <strong>${formatPKR(s.paid)}</strong>
          </div>
          ${s.photo ? `
          <div style="margin-top: 20px;">
            <div style="color: #FFD700; margin-bottom: 10px;">👤 Karigar Photo:</div>
            <img src="${s.photo}" style="width: 100%; max-width: 300px; border-radius: 8px; border: 2px solid #FFD700;">
          </div>` : ''}
          ${s.receipt ? `
          <div style="margin-top: 20px;">
            <div style="color: #FFD700; margin-bottom: 10px;">🧾 Receipt:</div>
            <img src="${s.receipt}" style="width: 100%; border-radius: 8px; border: 2px solid #FFD700;">
          </div>` : ''}
        </div>
      `;
      document.getElementById('viewContent').innerHTML = html;
      document.getElementById('viewModal').classList.add('active');
    }

    function closeViewModal() {
      document.getElementById('viewModal').classList.remove('active');
    }

    async function deleteService(id) {
      if (!confirm('Delete this service?')) return;
      await deleteRecord('services', id);
      loadServices();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadServices();
    });
  </script>

</body>
</html>
