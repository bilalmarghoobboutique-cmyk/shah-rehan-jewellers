<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">📊 Reports</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-nav">
    <button class="nav-btn" onclick="navigate('index.html')">🏠 Dashboard</button>
    <button class="nav-btn" onclick="navigate('purchase.html')">🛒 Purchase</button>
    <button class="nav-btn" onclick="navigate('services.html')">🔧 Services</button>
    <button class="nav-btn" onclick="navigate('store.html')">🏪 Store</button>
    <button class="nav-btn" onclick="navigate('sales.html')">💰 Sales</button>
    <button class="nav-btn" onclick="navigate('customers.html')">👥 Customers</button>
    <button class="nav-btn" onclick="navigate('suppliers.html')">📦 Suppliers</button>
    <button class="nav-btn" onclick="navigate('expenses.html')">💵 Expenses</button>
    <button class="nav-btn active">📊 Reports</button>
    <button class="nav-btn" onclick="navigate('settings.html')">⚙️ Settings</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Business Reports</h1>
    <p class="page-subtitle">Complete overview of your business</p>

    <div class="category-tabs">
      <button class="cat-tab gold active" onclick="switchReport('sales', this)">💰 Sales</button>
      <button class="cat-tab silver" onclick="switchReport('purchases', this)">🛒 Purchases</button>
      <button class="cat-tab diamond" onclick="switchReport('oldgold', this)">🥇 Old Gold</button>
      <button class="cat-tab artificial" onclick="switchReport('karigar', this)">🔧 Karigar Payments</button>
      <button class="cat-tab gold" onclick="switchReport('expenses', this)">💵 Expenses</button>
      <button class="cat-tab silver" onclick="switchReport('profit', this)">📈 Profit/Loss</button>
    </div>

    <div id="reportContent">
      <!-- Report content will be loaded here -->
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentReport = 'sales';

    function switchReport(type, btn) {
      currentReport = type;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      loadReport(type);
    }

    async function loadReport(type) {
      const container = document.getElementById('reportContent');

      if (type === 'sales') {
        const sales = await getAllRecords('sales') || [];
        const total = sales.reduce((s, x) => s + (x.total || 0), 0);
        const thisMonth = new Date().toISOString().slice(0, 7);
        const monthTotal = sales.filter(s => s.date?.startsWith(thisMonth)).reduce((s, x) => s + (x.total || 0), 0);

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card gold">
              <div class="stat-icon">💰</div>
              <div class="stat-value">${formatPKR(total)}</div>
              <div class="stat-label">Total Sales</div>
            </div>
            <div class="stat-card gold">
              <div class="stat-icon">📅</div>
              <div class="stat-value">${formatPKR(monthTotal)}</div>
              <div class="stat-label">This Month</div>
            </div>
            <div class="stat-card gold">
              <div class="stat-icon">📊</div>
              <div class="stat-value">${sales.length}</div>
              <div class="stat-label">Transactions</div>
            </div>
          </div>
          <h2 class="section-title">Sales Log</h2>
          <div class="data-list">
            ${sales.length === 0 ? '<div class="empty-state">No sales yet</div>' : 
              sales.slice().reverse().map(s => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${s.items_summary}</div>
                    <div class="data-item-sub">${s.customer_name} • ${s.invoice_number} • ${formatDate(s.date)}</div>
                  </div>
                  <div class="data-item-value">${formatPKR(s.total)}</div>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (type === 'purchases') {
        const purchases = await getAllRecords('purchases') || [];
        const total = purchases.reduce((s, x) => s + (x.total || 0), 0);
        const thisMonth = new Date().toISOString().slice(0, 7);
        const monthTotal = purchases.filter(p => p.date?.startsWith(thisMonth)).reduce((s, x) => s + (x.total || 0), 0);

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card silver">
              <div class="stat-icon">🛒</div>
              <div class="stat-value">${formatPKR(total)}</div>
              <div class="stat-label">Total Purchases</div>
            </div>
            <div class="stat-card silver">
              <div class="stat-icon">📅</div>
              <div class="stat-value">${formatPKR(monthTotal)}</div>
              <div class="stat-label">This Month</div>
            </div>
            <div class="stat-card silver">
              <div class="stat-icon">📊</div>
              <div class="stat-value">${purchases.length}</div>
              <div class="stat-label">Entries</div>
            </div>
          </div>
          <h2 class="section-title">Purchases Log</h2>
          <div class="data-list">
            ${purchases.length === 0 ? '<div class="empty-state">No purchases yet</div>' :
              purchases.slice().reverse().map(p => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${p.item}</div>
                    <div class="data-item-sub">${p.supplier} • ${p.category} • ${formatDate(p.date)}</div>
                  </div>
                  <div class="data-item-value">${formatPKR(p.total)}</div>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (type === 'oldgold') {
        const items = await getAllRecords('old_gold') || [];
        const total = items.reduce((s, x) => s + (x.total || 0), 0);
        const totalWeight = items.reduce((s, x) => s + (x.weight || 0), 0);

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card diamond">
              <div class="stat-icon">🥇</div>
              <div class="stat-value">${formatPKR(total)}</div>
              <div class="stat-label">Total Paid</div>
            </div>
            <div class="stat-card diamond">
              <div class="stat-icon">⚖️</div>
              <div class="stat-value">${totalWeight.toFixed(2)}g</div>
              <div class="stat-label">Total Weight Bought</div>
            </div>
            <div class="stat-card diamond">
              <div class="stat-icon">📊</div>
              <div class="stat-value">${items.length}</div>
              <div class="stat-label">Transactions</div>
            </div>
          </div>
          <h2 class="section-title">Old Gold Purchases</h2>
          <div class="data-list">
            ${items.length === 0 ? '<div class="empty-state">No old gold purchases yet</div>' :
              items.slice().reverse().map(g => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${g.item} (${g.metal_type})</div>
                    <div class="data-item-sub">${g.customer_name} • ${g.weight}g @ ${formatPKR(g.rate)}/g</div>
                  </div>
                  <div class="data-item-value">${formatPKR(g.total)}</div>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (type === 'karigar') {
        const services = await getAllRecords('services') || [];
        const totalCharges = services.reduce((s, x) => s + (x.charges || 0), 0);
        const totalPaid = services.reduce((s, x) => s + (x.paid || 0), 0);
        const pending = totalCharges - totalPaid;

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card artificial">
              <div class="stat-icon">💰</div>
              <div class="stat-value">${formatPKR(totalCharges)}</div>
              <div class="stat-label">Total Charges</div>
            </div>
            <div class="stat-card artificial">
              <div class="stat-icon">✅</div>
              <div class="stat-value">${formatPKR(totalPaid)}</div>
              <div class="stat-label">Total Paid</div>
            </div>
            <div class="stat-card artificial">
              <div class="stat-icon">⏳</div>
              <div class="stat-value">${formatPKR(pending)}</div>
              <div class="stat-label">Pending</div>
            </div>
          </div>
          <h2 class="section-title">Karigar Payment Log</h2>
          <div class="data-list">
            ${services.length === 0 ? '<div class="empty-state">No services yet</div>' :
              services.slice().reverse().map(s => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${s.item}</div>
                    <div class="data-item-sub">${s.karigar_name} • ${s.type} • ${formatDate(s.date)}</div>
                  </div>
                  <div style="text-align: right;">
                    <div class="data-item-value">${formatPKR(s.charges)}</div>
                    <div class="data-item-sub">Paid: ${formatPKR(s.paid)}</div>
                  </div>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (type === 'expenses') {
        const expenses = await getAllRecords('expenses') || [];
        const total = expenses.reduce((s, x) => s + (x.amount || 0), 0);
        const thisMonth = new Date().toISOString().slice(0, 7);
        const monthTotal = expenses.filter(e => e.date?.startsWith(thisMonth)).reduce((s, x) => s + (x.amount || 0), 0);

        // Group by category
        const byCategory = {};
        expenses.forEach(e => {
          byCategory[e.category] = (byCategory[e.category] || 0) + e.amount;
        });

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card silver">
              <div class="stat-icon">💵</div>
              <div class="stat-value">${formatPKR(total)}</div>
              <div class="stat-label">Total Expenses</div>
            </div>
            <div class="stat-card silver">
              <div class="stat-icon">📅</div>
              <div class="stat-value">${formatPKR(monthTotal)}</div>
              <div class="stat-label">This Month</div>
            </div>
            <div class="stat-card silver">
              <div class="stat-icon">📊</div>
              <div class="stat-value">${expenses.length}</div>
              <div class="stat-label">Entries</div>
            </div>
          </div>
          
          <h2 class="section-title">By Category</h2>
          <div class="data-list">
            ${Object.entries(byCategory).map(([cat, amt]) => `
              <div class="data-item">
                <div class="data-item-title">${cat.toUpperCase()}</div>
                <div class="data-item-value">${formatPKR(amt)}</div>
              </div>
            `).join('')}
          </div>
        `;
      }

      else if (type === 'profit') {
        const sales = await getAllRecords('sales') || [];
        const purchases = await getAllRecords('purchases') || [];
        const oldGold = await getAllRecords('old_gold') || [];
        const expenses = await getAllRecords('expenses') || [];
        const services = await getAllRecords('services') || [];

        const totalSales = sales.reduce((s, x) => s + (x.total || 0), 0);
        const totalPurchases = purchases.reduce((s, x) => s + (x.total || 0), 0);
        const totalOldGold = oldGold.reduce((s, x) => s + (x.total || 0), 0);
        const totalExpenses = expenses.reduce((s, x) => s + (x.amount || 0), 0);
        const totalKarigar = services.reduce((s, x) => s + (x.paid || 0), 0);

        const totalOut = totalPurchases + totalOldGold + totalExpenses + totalKarigar;
        const profit = totalSales - totalOut;

        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card gold">
              <div class="stat-icon">💰</div>
              <div class="stat-value">${formatPKR(totalSales)}</div>
              <div class="stat-label">Total Income (Sales)</div>
            </div>
            <div class="stat-card silver">
              <div class="stat-icon">🛒</div>
              <div class="stat-value">${formatPKR(totalPurchases)}</div>
              <div class="stat-label">Purchases</div>
            </div>
            <div class="stat-card diamond">
              <div class="stat-icon">🥇</div>
              <div class="stat-value">${formatPKR(totalOldGold)}</div>
              <div class="stat-label">Old Gold Bought</div>
            </div>
            <div class="stat-card artificial">
              <div class="stat-icon">🔧</div>
              <div class="stat-value">${formatPKR(totalKarigar)}</div>
              <div class="stat-label">Karigar Paid</div>
            </div>
            <div class="stat-card silver">
              <div class="stat-icon">💵</div>
              <div class="stat-value">${formatPKR(totalExpenses)}</div>
              <div class="stat-label">Expenses</div>
            </div>
          </div>

          <div class="form-card" style="background: linear-gradient(135deg, ${profit >= 0 ? 'rgba(37,211,102,0.1)' : 'rgba(220,38,38,0.1)'}, #1C1C1C); border-color: ${profit >= 0 ? '#25D366' : '#DC2626'};">
            <h3 class="form-card-title" style="color: ${profit >= 0 ? '#86EFAC' : '#FCA5A5'};">
              ${profit >= 0 ? '📈 NET PROFIT' : '📉 NET LOSS'}
            </h3>
            <div style="text-align: center; padding: 20px;">
              <div style="font-family: 'Playfair Display', serif; font-size: 3rem; color: ${profit >= 0 ? '#25D366' : '#DC2626'};">
                ${formatPKR(Math.abs(profit))}
              </div>
              <div style="color: #B8B8B8; margin-top: 10px;">
                Income (${formatPKR(totalSales)}) - Outgoing (${formatPKR(totalOut)})
              </div>
            </div>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadReport('sales');
    });
  </script>

</body>
</html>
