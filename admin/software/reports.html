<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reports – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>
  <div class="sw-header">
    <div class="sw-logo"><img src="images/reports.png" onerror="this.style.display='none'" style="width:24px; margin-right:8px;">Reports</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-content" style="padding-top: 20px;">
    <h1 class="page-title">Business Reports</h1>

    <div class="category-tabs">
      <button class="cat-tab gold active" onclick="switchReport('purchases', this)">Purchase Khata</button>
      <button class="cat-tab silver" onclick="switchReport('debtors', this)">Debtors (Receivable)</button>
      <button class="cat-tab artificial" onclick="switchReport('creditors', this)">Creditors (Payable)</button>
      <button class="cat-tab diamond" onclick="switchReport('sales', this)">Sales Log</button>
    </div>

    <div id="reportContent"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    async function switchReport(type, btn) {
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      const container = document.getElementById('reportContent');

      if (type === 'purchases') {
        const purchases = await getAllRecords('purchases') || [];
        container.innerHTML = `
          <h2 class="section-title">All Purchase Records</h2>
          <div class="data-list">
            ${purchases.length === 0 ? '<div class="empty-state">No purchases</div>' : 
              purchases.map(p => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${p.item}</div>
                    <div class="data-item-sub">${p.supplier_name} • ${formatDate(p.date)}</div>
                  </div>
                  <div style="text-align:right;">
                    <div class="data-item-value">${formatPKR(p.total)}</div>
                    <div class="data-item-sub" style="color:${p.balance > 0 ? '#FCD34D' : '#86EFAC'};">Bal: ${formatPKR(p.balance)}</div>
                  </div>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (type === 'debtors') {
        const sales = await getAllRecords('sales') || [];
        const debtors = sales.filter(s => (parseFloat(s.balance) || 0) > 0);
        const totalDue = debtors.reduce((s, x) => s + (parseFloat(x.balance) || 0), 0);
        
        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card gold"><div class="stat-icon">💰</div><div class="stat-value">${formatPKR(totalDue)}</div><div class="stat-label">Total Receivable</div></div>
          </div>
          <h2 class="section-title">Customers Owing Money</h2>
          <div class="data-list">
            ${debtors.length === 0 ? '<div class="empty-state">No outstanding dues</div>' : 
              debtors.map(d => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${d.customer_name}</div>
                    <div class="data-item-sub">${d.invoice_number} • ${formatDate(d.date)}</div>
                  </div>
                  <div style="text-align:right;">
                    <div class="data-item-value" style="color:#FCD34D;">${formatPKR(d.balance)}</div>
                  </div>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (type === 'creditors') {
        const purchases = await getAllRecords('purchases') || [];
        const creditors = purchases.filter(p => (parseFloat(p.balance) || 0) > 0);
        const totalPayable = creditors.reduce((s, x) => s + (parseFloat(x.balance) || 0), 0);
        
        container.innerHTML = `
          <div class="stats-grid">
            <div class="stat-card artificial"><div class="stat-icon">📌</div><div class="stat-value">${formatPKR(totalPayable)}</div><div class="stat-label">Total Payable</div></div>
          </div>
          <h2 class="section-title">Suppliers We Owe</h2>
          <div class="data-list">
            ${creditors.length === 0 ? '<div class="empty-state">No supplier dues</div>' : 
              creditors.map(p => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${p.supplier_name}</div>
                    <div class="data-item-sub">${p.item} • ${formatDate(p.date)}</div>
                  </div>
                  <div style="text-align:right;">
                    <div class="data-item-value" style="color:#FCD34D;">${formatPKR(p.balance)}</div>
                  </div>
                </div>
              `).join('')}
          </div>
        `;
      }

      else if (type === 'sales') {
        const sales = await getAllRecords('sales') || [];
        container.innerHTML = `
          <h2 class="section-title">All Sales</h2>
          <div class="data-list">
            ${sales.length === 0 ? '<div class="empty-state">No sales</div>' : 
              sales.map(s => `
                <div class="data-item">
                  <div>
                    <div class="data-item-title">${s.items_summary}</div>
                    <div class="data-item-sub">${s.customer_name} • ${s.invoice_number}</div>
                  </div>
                  <div class="data-item-value">${formatPKR(s.total)}</div>
                </div>
              `).join('')}
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => { 
      await initDB(); 
      switchReport('purchases', document.querySelector('.cat-tab')); 
    });
  </script>
</body>
</html>
