<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purchase – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo"><img src="images/purchase.png" onerror="this.style.display='none'" style="width:28px; height:28px; vertical-align:middle; margin-right:8px;"> Purchase</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-nav">
    <button class="nav-btn" onclick="navigate('index.html')">Dashboard</button>
    <button class="nav-btn active">Purchase</button>
    <button class="nav-btn" onclick="navigate('services.html')">Services</button>
    <button class="nav-btn" onclick="navigate('store.html')">Store</button>
    <button class="nav-btn" onclick="navigate('sales.html')">Sales</button>
    <button class="nav-btn" onclick="navigate('customers.html')">Customers</button>
    <button class="nav-btn" onclick="navigate('suppliers.html')">Suppliers</button>
    <button class="nav-btn" onclick="navigate('expenses.html')">Expenses</button>
    <button class="nav-btn" onclick="navigate('reports.html')">Reports</button>
    <button class="nav-btn" onclick="navigate('settings.html')">Settings</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Purchase Entry</h1>
    <p class="page-subtitle">Record purchases with vendor details & images</p>

    <div class="category-tabs">
      <button class="cat-tab gold active" onclick="switchCategory('gold', this)"><img src="images/gold.png" onerror="this.style.display='none'" style="width:16px; vertical-align:middle; margin-right:4px;"> Gold</button>
      <button class="cat-tab silver" onclick="switchCategory('silver', this)"><img src="images/silver.png" onerror="this.style.display='none'" style="width:16px; vertical-align:middle; margin-right:4px;"> Silver</button>
      <button class="cat-tab diamond" onclick="switchCategory('diamond', this)"><img src="images/diamond.png" onerror="this.style.display='none'" style="width:16px; vertical-align:middle; margin-right:4px;"> Diamond</button>
    </div>

    <div class="form-card">
      <h3 class="form-card-title">Supplier / Vendor Info</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Supplier Name *</label>
          <input type="text" id="pSupplier" class="form-input" placeholder="Supplier name">
        </div>
        <div class="form-group">
          <label class="form-label">Phone *</label>
          <input type="tel" id="pPhone" class="form-input" placeholder="03XXXXXXXXX">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Address</label>
          <input type="text" id="pAddress" class="form-input" placeholder="Full address">
        </div>
        <div class="form-group">
          <label class="form-label">Supplier Photo</label>
          <input type="file" id="pSupplierPhoto" class="form-input" accept="image/*" capture="user" style="padding:10px;">
          <div id="pSupplierPhotoPreview" style="margin-top:10px;"></div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Bill Image</label>
        <input type="file" id="pBillImage" class="form-input" accept="image/*" capture="environment" style="padding:10px;">
        <div id="pBillPreview" style="margin-top:10px;"></div>
      </div>
    </div>

    <div class="form-card">
      <h3 class="form-card-title" id="formTitle">Purchase Details</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Invoice/Bill #</label>
          <input type="text" id="pInvoice" class="form-input" placeholder="Bill no.">
        </div>
        <div class="form-group" id="karatRow">
          <label class="form-label">Karat</label>
          <select id="pKarat" class="form-select">
            <option value="24K">24K</option>
            <option value="22K" selected>22K</option>
            <option value="21K">21K</option>
            <option value="18K">18K</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Item Description *</label>
        <input type="text" id="pItem" class="form-input" placeholder="e.g., Gold Necklace Set">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Weight (grams) *</label>
          <input type="number" id="pWeight" class="form-input" step="0.001" placeholder="0.000">
        </div>
        <div class="form-group">
          <label class="form-label">Rate/gram (Rs) *</label>
          <input type="number" id="pRate" class="form-input" placeholder="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Total Cost (Rs) *</label>
          <input type="number" id="pTotal" class="form-input" readonly style="background:#2A2A2A; color:#FFF8DC;">
        </div>
        <div class="form-group">
          <label class="form-label">Paid Amount (Rs)</label>
          <input type="number" id="pPaid" class="form-input" placeholder="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Balance / Udhaar (Rs)</label>
          <input type="number" id="pBalance" class="form-input" readonly style="background:#2A2A2A; color:#FCD34D; font-weight:700;">
        </div>
        <div class="form-group">
          <label class="form-label">Payment Mode</label>
          <select id="pPayment" class="form-select">
            <option value="cash">Cash</option>
            <option value="bank">Bank Transfer</option>
            <option value="credit">Credit (Udhaar)</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap;">
        <button class="btn-primary" onclick="savePurchase(false)" style="flex: 1;">Save Purchase</button>
        <button class="btn-secondary" onclick="savePurchase(true)" style="flex: 1; background: #25D366; color: white; border: none;">Save & WhatsApp Invoice</button>
      </div>
    </div>

    <h2 class="section-title">Recent Purchases</h2>
    <div class="data-list" id="purchasesList"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let currentCategory = 'gold';
    let pSupplierPhotoUrl = null;
    let pBillImageUrl = null;

    document.getElementById('pSupplierPhoto')?.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        document.getElementById('pSupplierPhotoPreview').innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:100px; border-radius:8px; border:2px solid #FFD700;">`;
      }
    });
    document.getElementById('pBillImage')?.addEventListener('change', (e) => {
      if (e.target.files[0]) {
        document.getElementById('pBillPreview').innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:150px; border-radius:8px; border:2px solid #FFD700;">`;
      }
    });

    function switchCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('karatRow').style.display = (cat === 'diamond') ? 'none' : 'block';
    }

    function autoCalc() {
      const weight = parseFloat(document.getElementById('pWeight').value) || 0;
      const rate = parseFloat(document.getElementById('pRate').value) || 0;
      const total = Math.round(weight * rate);
      document.getElementById('pTotal').value = total;
      const paid = parseFloat(document.getElementById('pPaid').value) || 0;
      document.getElementById('pBalance').value = Math.max(0, total - paid);
    }
    ['pWeight', 'pRate', 'pPaid'].forEach(id => document.getElementById(id)?.addEventListener('input', autoCalc));

    async function savePurchase(openWhatsApp) {
      const supplier = document.getElementById('pSupplier').value.trim();
      const phone = document.getElementById('pPhone').value.trim();
      const item = document.getElementById('pItem').value.trim();
      const total = parseFloat(document.getElementById('pTotal').value) || 0;
      
      if (!supplier || !phone || !item || total <= 0) {
        alert('Please fill supplier name, phone, item, and valid amounts');
        return;
      }

      const btn = event.target;
      btn.textContent = 'Saving...';
      btn.disabled = true;

      try {
        // Upload images to Cloudinary
        if (document.getElementById('pSupplierPhoto').files[0]) {
          pSupplierPhotoUrl = await uploadImage(document.getElementById('pSupplierPhoto').files[0]);
        }
        if (document.getElementById('pBillImage').files[0]) {
          pBillImageUrl = await uploadImage(document.getElementById('pBillImage').files[0]);
        }

        const purchase = {
          category: currentCategory,
          supplier_name: supplier,
          supplier_phone: phone,
          supplier_address: document.getElementById('pAddress').value.trim(),
          invoice_no: document.getElementById('pInvoice').value.trim(),
          karat: document.getElementById('pKarat').value,
          item: item,
          weight: parseFloat(document.getElementById('pWeight').value) || 0,
          rate: parseFloat(document.getElementById('pRate').value) || 0,
          total: total,
          paid: parseFloat(document.getElementById('pPaid').value) || 0,
          balance: parseFloat(document.getElementById('pBalance').value) || 0,
          payment_mode: document.getElementById('pPayment').value,
          supplier_photo: pSupplierPhotoUrl,
          bill_image: pBillImageUrl
        };

        const saved = await addRecord('purchases', purchase);
        
        if (openWhatsApp) {
          // Yahan await lagana zaroori tha taake cloud se settings aayen
          const shop = await getShopSettings();
          const msg = buildPurchaseInvoiceMessage(saved, shop);
          openWhatsApp(phone, msg);
        } else {
          alert('✅ Purchase saved!');
        }
        
        clearForm();
        loadPurchases();
      } catch (error) {
        alert('❌ Error: ' + error.message);
      } finally {
        btn.textContent = openWhatsApp ? 'Save & WhatsApp Invoice' : 'Save Purchase';
        btn.disabled = false;
      }
    }

    function clearForm() {
      ['pSupplier','pPhone','pAddress','pInvoice','pItem','pWeight','pRate','pTotal','pPaid','pBalance'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('pSupplierPhoto').value = '';
      document.getElementById('pBillImage').value = '';
      document.getElementById('pSupplierPhotoPreview').innerHTML = '';
      document.getElementById('pBillPreview').innerHTML = '';
      pSupplierPhotoUrl = null; pBillImageUrl = null;
    }

    async function loadPurchases() {
      const purchases = await getAllRecords('purchases') || [];
      const container = document.getElementById('purchasesList');
      if (purchases.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No purchases yet</p></div>';
        return;
      }
      container.innerHTML = purchases.slice(0, 20).map(p => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${p.item} (${p.karat || p.category})</div>
            <div class="data-item-sub">${p.supplier_name} • 📞 ${p.supplier_phone} • ${p.weight}g @ Rs ${p.rate}</div>
            ${p.balance > 0 ? `<div class="data-item-sub" style="color:#FCD34D;">Balance: ${formatPKR(p.balance)}</div>` : ''}
          </div>
          <div class="data-item-value">${formatPKR(p.total)}</div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadPurchases();
    });
  </script>
</body>
</html>
