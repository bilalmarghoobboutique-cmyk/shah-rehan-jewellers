<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Services – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
</head>
<body>
  <div class="sw-header">
    <div class="sw-logo"><img src="images/tools.png" onerror="this.style.display='none'" style="width:24px; margin-right:8px;">Karigar Services</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-nav">
    <button class="nav-btn" onclick="navigate('index.html')">Dashboard</button>
    <button class="nav-btn" onclick="navigate('purchase.html')">Purchase</button>
    <button class="nav-btn active">Services</button>
    <button class="nav-btn" onclick="navigate('store.html')">Store</button>
    <button class="nav-btn" onclick="navigate('sales.html')">Sales</button>
    <button class="nav-btn" onclick="navigate('customers.html')">Customers</button>
    <button class="nav-btn" onclick="navigate('suppliers.html')">Suppliers</button>
    <button class="nav-btn" onclick="navigate('reports.html')">Reports</button>
    <button class="nav-btn" onclick="navigate('settings.html')">Settings</button>
  </div>

  <div class="sw-content">
    <h1 class="page-title">Karigar Services</h1>
    <p class="page-subtitle">Manage karigars & job invoices</p>

    <div class="form-card">
      <h3 class="form-card-title">Karigar Info</h3>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Karigar Name *</label><input type="text" id="kName" class="form-input" placeholder="Name"></div>
        <div class="form-group"><label class="form-label">Phone *</label><input type="tel" id="kPhone" class="form-input" placeholder="03XXXXXXXXX"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Item Description *</label><input type="text" id="kItem" class="form-input" placeholder="e.g., Ring Polish"></div>
        <div class="form-group"><label class="form-label">Karigar Photo</label><input type="file" id="kPhoto" class="form-input" accept="image/*" capture="user" style="padding:10px;"><div id="kPhotoPreview" style="margin-top:5px;"></div></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Service Charges (Rs) *</label><input type="number" id="kCharges" class="form-input" placeholder="0"></div>
        <div class="form-group"><label class="form-label">Paid Amount (Rs)</label><input type="number" id="kPaid" class="form-input" placeholder="0"></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">Balance (Rs)</label><input type="number" id="kBalance" class="form-input" readonly style="background:#2A2A2A; color:#FCD34D;"></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select id="kStatus" class="form-select">
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
            <option value="delivered">Delivered</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 12px; margin-top: 15px; flex-wrap: wrap;">
        <button class="btn-primary" onclick="saveService(false)" style="flex: 1;">Save Service</button>
        <button class="btn-secondary" onclick="saveService(true)" style="flex: 1; background: #25D366; color: white; border: none;">Save & WhatsApp Job</button>
      </div>
    </div>

    <h2 class="section-title">Service Records</h2>
    <div class="data-list" id="servicesList"></div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let kPhotoUrl = null;

    document.getElementById('kPhoto')?.addEventListener('change', (e) => {
      if (e.target.files[0]) document.getElementById('kPhotoPreview').innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="max-width:80px; border-radius:8px;">`;
    });

    function autoCalc() {
      const charges = parseFloat(document.getElementById('kCharges').value) || 0;
      const paid = parseFloat(document.getElementById('kPaid').value) || 0;
      document.getElementById('kBalance').value = Math.max(0, charges - paid);
    }
    ['kCharges', 'kPaid'].forEach(id => document.getElementById(id)?.addEventListener('input', autoCalc));

    async function saveService(openWhatsApp) {
      const name = document.getElementById('kName').value.trim();
      const phone = document.getElementById('kPhone').value.trim();
      const item = document.getElementById('kItem').value.trim();
      if (!name || !phone || !item) { alert('❌ Name, phone, and item are required'); return; }

      const btn = event.target;
      btn.textContent = 'Saving...'; btn.disabled = true;

      try {
        if (document.getElementById('kPhoto').files[0]) {
          kPhotoUrl = await uploadImage(document.getElementById('kPhoto').files[0]);
        }

        const service = {
          karigar_name: name,
          karigar_phone: phone,
          item: item,
          charges: parseFloat(document.getElementById('kCharges').value) || 0,
          paid: parseFloat(document.getElementById('kPaid').value) || 0,
          balance: parseFloat(document.getElementById('kBalance').value) || 0,
          status: document.getElementById('kStatus').value,
          photo: kPhotoUrl
        };

        const saved = await addRecord('services', service);
        
        if (openWhatsApp) {
          const msg = buildJobInvoiceMessage(saved, getShopSettings());
          openWhatsApp(phone, msg);
        } else {
          alert('✅ Service saved!');
        }
        
        clearForm(); loadServices();
      } catch (e) {
        alert('❌ ' + e.message);
      } finally {
        btn.textContent = openWhatsApp ? 'Save & WhatsApp Job' : 'Save Service';
        btn.disabled = false;
      }
    }

    function clearForm() {
      ['kName','kPhone','kItem','kCharges','kPaid','kBalance'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('kPhoto').value = '';
      document.getElementById('kPhotoPreview').innerHTML = '';
      kPhotoUrl = null;
    }

    async function loadServices() {
      const services = await getAllRecords('services') || [];
      const container = document.getElementById('servicesList');
      if (services.length === 0) { container.innerHTML = '<div class="empty-state"><p>No services yet</p></div>'; return; }
      
      container.innerHTML = services.map(s => `
        <div class="data-item">
          <div>
            <div class="data-item-title">${s.item}</div>
            <div class="data-item-sub">${s.karigar_name} • 📞 ${s.karigar_phone}</div>
          </div>
          <div style="text-align:right;">
            <div class="data-item-value">${formatPKR(s.charges)}</div>
            <div class="data-item-sub" style="color:${s.balance > 0 ? '#FCD34D' : '#86EFAC'};">Bal: ${formatPKR(s.balance)}</div>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', async () => { await initDB(); loadServices(); });
  </script>
</body>
</html>
