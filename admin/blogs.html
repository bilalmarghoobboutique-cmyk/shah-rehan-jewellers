<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blogs Management – SHAH REHAN JEWELLERS Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background: #0A0A0A; color: #FFF8DC; font-family: 'Poppins', sans-serif; }
    .admin-header { background: #1C1C1C; border-bottom: 2px solid #FFD700; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
    .admin-logo { font-family: 'Playfair Display', serif; font-size: 1.3rem; color: #FFD700; font-weight: 700; }
    .admin-nav { display: flex; gap: 20px; align-items: center; }
    .admin-nav a { color: #FFF8DC; text-decoration: none; font-size: 0.9rem; }
    .admin-nav a:hover, .admin-nav a.active { color: #FFD700; }
    .logout-btn { background: rgba(220,38,38,0.2); color: #FCA5A5; padding: 8px 18px; border-radius: 50px; border: 1px solid #DC2626; cursor: pointer; font-size: 0.85rem; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #FFD700; }
    .btn-add { background: linear-gradient(135deg, #FFD700, #C9A227); color: #0A0A0A; padding: 12px 28px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; }
    .blog-admin-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 25px; }
    .blog-admin-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; overflow: hidden; }
    .blog-admin-card img { width: 100%; height: 180px; object-fit: cover; }
    .blog-admin-info { padding: 15px; }
    .blog-admin-info h4 { color: #FFD700; font-size: 1rem; margin-bottom: 6px; }
    .blog-admin-info p { color: #B8B8B8; font-size: 0.85rem; }
    .blog-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-edit { flex: 1; background: rgba(59,130,246,0.2); color: #93C5FD; border: 1px solid #3B82F6; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-delete { flex: 1; background: rgba(220,38,38,0.2); color: #FCA5A5; border: 1px solid #DC2626; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .admin-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .admin-modal.active { display: flex; }
    .admin-modal-content { background: #1C1C1C; border: 2px solid #FFD700; border-radius: 20px; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; }
    .admin-modal-content h2 { color: #FFD700; font-family: 'Playfair Display', serif; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    .form-label { color: #FFD700; font-size: 0.85rem; display: block; margin-bottom: 6px; }
    .form-input { width: 100%; padding: 10px 14px; background: #0A0A0A; border: 1px solid rgba(255,215,0,0.3); border-radius: 8px; color: #FFF8DC; }
    .form-input:focus { outline: none; border-color: #FFD700; }
    .image-upload-box { border: 2px dashed rgba(255,215,0,0.4); border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; }
    .image-upload-box:hover { border-color: #FFD700; background: rgba(255,215,0,0.05); }
    .image-preview { max-width: 200px; margin: 10px auto; border-radius: 8px; }
  </style>
</head>
<body>

  <div class="admin-header">
    <div class="admin-logo">SHAH REHAN JEWELLERS – Admin</div>
    <nav class="admin-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="products.html">Products</a>
      <a href="orders.html">Orders</a>
      <a href="vlogs.html">Vlogs</a>
      <a href="blogs.html" class="active">Blogs</a>
      <a href="settings.html">Settings</a>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </nav>
  </div>

  <div style="max-width: 1400px; margin: 0 auto; padding: 25px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 class="section-title">Blogs Management</h1>
      <button class="btn-add" onclick="openBlogModal()">+ Add Blog</button>
    </div>
    <div id="blogsGrid" class="blog-admin-grid"></div>
  </div>

  <!-- Blog Modal -->
  <div id="blogModal" class="admin-modal">
    <div class="admin-modal-content">
      <h2 id="blogModalTitle">Add New Blog</h2>
      <form id="blogForm">
        <input type="hidden" id="editBlogId">
        <div class="form-group">
          <label class="form-label">Title *</label>
          <input type="text" id="blogTitle" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">Meta Title (SEO)</label>
          <input type="text" id="blogMetaTitle" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label">Meta Description (SEO)</label>
          <textarea id="blogMetaDescription" class="form-input" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Keywords (comma separated)</label>
          <input type="text" id="blogKeywords" class="form-input" placeholder="gold rate, bridal jewellery, Lahore">
        </div>
        <div class="form-group">
          <label class="form-label">Excerpt (Short Summary)</label>
          <textarea id="blogExcerpt" class="form-input" rows="2"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Content (HTML allowed) *</label>
          <textarea id="blogContent" class="form-input" rows="8" required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Featured Image</label>
          <div class="image-upload-box" onclick="document.getElementById('blogImage').click()">
            <p style="color: #FFD700;">📷 Click to Upload Image</p>
            <img id="imagePreview" class="image-preview" style="display:none;">
          </div>
          <input type="file" id="blogImage" accept="image/*" style="display:none;" onchange="previewImage(this)">
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="blogCategory" class="form-input">
            <option value="Gold Rate">Gold Rate</option>
            <option value="Bridal">Bridal</option>
            <option value="Investment">Investment</option>
            <option value="Diamond">Diamond</option>
            <option value="Silver">Silver</option>
            <option value="Artificial">Artificial</option>
            <option value="Custom">Custom</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px;">
          <button type="button" onclick="closeBlogModal()" style="flex:1; padding:12px; background:transparent; border:2px solid #FFD700; color:#FFD700; border-radius:50px; cursor:pointer;">Cancel</button>
          <button type="submit" class="btn-add" style="flex:1;">Save Blog</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../js/supabase.js"></script>
  <script>
    let uploadedImageUrl = '';

    function previewImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const preview = document.getElementById('imagePreview');
          preview.src = e.target.result;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    async function uploadImage(file) {
      // Simple base64 conversion for demo
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
    }

    function openBlogModal() {
      document.getElementById('blogModalTitle').textContent = 'Add New Blog';
      document.getElementById('blogForm').reset();
      document.getElementById('editBlogId').value = '';
      document.getElementById('imagePreview').style.display = 'none';
      uploadedImageUrl = '';
      document.getElementById('blogModal').classList.add('active');
    }

    function closeBlogModal() {
      document.getElementById('blogModal').classList.remove('active');
    }

    function logout() {
      localStorage.removeItem('srj_admin_session');
      window.location.href = 'login.html';
    }

    async function loadBlogs() {
      const grid = document.getElementById('blogsGrid');
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/blogs?select=*&order=created_at.desc`, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
        });
        const blogs = await res.json();
        
        if (!blogs || blogs.length === 0) {
          grid.innerHTML = '<p style="color:#B8B8B8; grid-column:1/-1; text-align:center;">No blogs yet</p>';
          return;
        }
        
        grid.innerHTML = blogs.map(b => `
          <div class="blog-admin-card">
            <img src="${b.featured_image || 'images/placeholder.svg'}" onerror="this.src='images/placeholder.svg'">
            <div class="blog-admin-info">
              <h4>${b.title}</h4>
              <p>${b.category || 'Blog'}</p>
              <div class="blog-actions">
                <button class="btn-edit" onclick='editBlog(${JSON.stringify(b).replace(/'/g, "&#39;")})'>✏️ Edit</button>
                <button class="btn-delete" onclick="deleteBlog('${b.id}')">🗑️ Delete</button>
              </div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        grid.innerHTML = '<p style="color:#FCA5A5;">Error</p>';
      }
    }

    function editBlog(blog) {
      document.getElementById('blogModalTitle').textContent = 'Edit Blog';
      document.getElementById('editBlogId').value = blog.id;
      document.getElementById('blogTitle').value = blog.title || '';
      document.getElementById('blogMetaTitle').value = blog.meta_title || '';
      document.getElementById('blogMetaDescription').value = blog.meta_description || '';
      document.getElementById('blogKeywords').value = (blog.keywords || []).join(', ');
      document.getElementById('blogExcerpt').value = blog.excerpt || '';
      document.getElementById('blogContent').value = blog.content || '';
      document.getElementById('blogCategory').value = blog.category || 'Gold Rate';
      uploadedImageUrl = blog.featured_image || '';
      if (uploadedImageUrl) {
        document.getElementById('imagePreview').src = uploadedImageUrl;
        document.getElementById('imagePreview').style.display = 'block';
      }
      document.getElementById('blogModal').classList.add('active');
    }

    document.getElementById('blogForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('editBlogId').value;
      const imageFile = document.getElementById('blogImage').files[0];
      
      if (imageFile) {
        uploadedImageUrl = await uploadImage(imageFile);
      }
      
      const blogData = {
        title: document.getElementById('blogTitle').value,
        slug: document.getElementById('blogTitle').value.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
        meta_title: document.getElementById('blogMetaTitle').value,
        meta_description: document.getElementById('blogMetaDescription').value,
        keywords: document.getElementById('blogKeywords').value.split(',').map(k => k.trim()),
        excerpt: document.getElementById('blogExcerpt').value,
        content: document.getElementById('blogContent').value,
        featured_image: uploadedImageUrl,
        category: document.getElementById('blogCategory').value
      };

      const url = editId ? `${SUPABASE_URL}/rest/v1/blogs?id=eq.${editId}` : `${SUPABASE_URL}/rest/v1/blogs`;
      const method = editId ? 'PATCH' : 'POST';
      
      await fetch(url, {
        method,
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' },
        body: JSON.stringify(blogData)
      });
      
      alert('✅ Blog saved!');
      closeBlogModal();
      loadBlogs();
    });

    async function deleteBlog(id) {
      if (!confirm('Delete this blog?')) return;
      await fetch(`${SUPABASE_URL}/rest/v1/blogs?id=eq.${id}`, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` }
      });
      loadBlogs();
    }

    document.addEventListener('DOMContentLoaded', loadBlogs);
  </script>
</body>
</html>
