<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-software.css">
  <style>
    .sw-content { max-width: 800px; }
    .settings-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .settings-card h3 { color: #FFD700; margin-bottom: 15px; }
  </style>
</head>
<body>
  <div class="sw-header">
    <div class="sw-logo"><img src="images/settings.png" onerror="this.style.display='none'" style="width:24px; margin-right:8px;">Settings</div>
    <button onclick="navigate('index.html')" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer; font-family: 'Poppins', sans-serif;">← Back</button>
  </div>

  <div class="sw-content" style="padding-top: 20px;">
    <h2 class="section-title">Software Settings</h2>

    <div class="settings-card">
      <h3>Shop Information</h3>
      <div class="form-group"><label class="form-label">Shop Name</label><input type="text" id="setShopName" class="form-input"></div>
      <div class="form-group"><label class="form-label">Address</label><input type="text" id="setShopAddress" class="form-input"></div>
      <div class="form-group"><label class="form-label">WhatsApp Number</label><input type="text" id="setShopPhone" class="form-input"></div>
      
      <div class="form-group">
        <label class="form-label">Admin Photo (For Invoice)</label>
        <input type="file" id="setAdminPhoto" class="form-input" accept="image/*" style="padding:10px;">
        <div id="adminPhotoPreview" style="margin-top:10px;"></div>
      </div>
      <button class="btn-primary" onclick="saveSettings()" style="width:100%;">Save Shop Info</button>
    </div>

    <div class="settings-card">
      <h3>Business Rules</h3>
      <div class="form-row">
        <div class="form-group"><label class="form-label">GST %</label><input type="number" id="setGST" class="form-input"></div>
        <div class="form-group"><label class="form-label">Making %</label><input type="number" id="setMaking" class="form-input"></div>
      </div>
      <button class="btn-primary" onclick="saveRules()" style="width:100%;">Save Rules</button>
    </div>

    <div class="settings-card">
      <h3>Danger Zone</h3>
      <button class="btn-danger" onclick="clearAllData()">Clear All Cloud Data</button>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    let newAdminPhotoUrl = null;

    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      const s = getShopSettings();
      document.getElementById('setShopName').value = s.name;
      document.getElementById('setShopAddress').value = s.address;
      document.getElementById('setShopPhone').value = s.phone;
      document.getElementById('setGST').value = s.gst_pct;
      document.getElementById('setMaking').value = s.making_pct;
      if (s.admin_photo) document.getElementById('adminPhotoPreview').innerHTML = `<img src="${s.admin_photo}" style="height:60px; border-radius:8px;">`;
    });

    document.getElementById('setAdminPhoto')?.addEventListener('change', (e) => {
      if (e.target.files[0]) document.getElementById('adminPhotoPreview').innerHTML = `<img src="${URL.createObjectURL(e.target.files[0])}" style="height:60px; border-radius:8px;">`;
    });

    async function saveSettings() {
      const btn = event.target;
      btn.textContent = 'Saving...'; btn.disabled = true;

      try {
        if (document.getElementById('setAdminPhoto').files[0]) {
          newAdminPhotoUrl = await uploadImage(document.getElementById('setAdminPhoto').files[0]);
        }
        
        const s = getShopSettings();
        s.name = document.getElementById('setShopName').value;
        s.address = document.getElementById('setShopAddress').value;
        s.phone = document.getElementById('setShopPhone').value;
        if (newAdminPhotoUrl) s.admin_photo = newAdminPhotoUrl;
        
        saveShopSettings(s);
        alert('✅ Shop info saved!');
      } catch (e) {
        alert('❌ ' + e.message);
      } finally {
        btn.textContent = 'Save Shop Info'; btn.disabled = false;
      }
    }

    function saveRules() {
      const s = getShopSettings();
      s.gst_pct = parseFloat(document.getElementById('setGST').value) || 0;
      s.making_pct = parseFloat(document.getElementById('setMaking').value) || 0;
      saveShopSettings(s);
      alert('✅ Rules saved!');
    }

    async function clearAllData() {
      if (!confirm('⚠️ Delete ALL data?')) return;
      if (!confirm('⚠️ Are you absolutely sure?')) return;
      const tables = ['sales','stock','customers','expenses','purchases','services','old_gold','suppliers'];
      for (const t of tables) {
        try { await clearStore(t); } catch (e) { console.warn(t, e.message); }
      }
      alert('✅ All data cleared');
    }
  </script>
</body>
</html>
