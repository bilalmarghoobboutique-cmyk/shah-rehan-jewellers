<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRJ Software – Dashboard</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0A0A0A; color: #FFF8DC; font-family: 'Poppins', sans-serif; min-height: 100vh; }
    .sw-header { background: linear-gradient(135deg, #1C1C1C, #2A2A2A); border-bottom: 2px solid #FFD700; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .sw-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: #FFD700; font-weight: 700; }
    .sync-status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #B8B8B8; }
    .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #25D366; }
    .status-dot.offline { background: #DC2626; }
    .install-btn { background: linear-gradient(135deg, #FFD700, #C9A227); color: #0A0A0A; padding: 8px 18px; border: none; border-radius: 50px; font-weight: 600; cursor: pointer; font-size: 0.85rem; display: none; }
    .install-btn.show { display: inline-block; }
    .sw-nav { display: flex; overflow-x: auto; gap: 5px; padding: 10px 15px; background: #1C1C1C; border-bottom: 1px solid rgba(255,215,0,0.2); }
    .nav-btn { padding: 10px 20px; background: transparent; border: 1px solid rgba(255,215,0,0.3); color: #FFF8DC; border-radius: 50px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
    .nav-btn.active, .nav-btn:hover { background: #FFD700; color: #0A0A0A; }
    .sw-content { padding: 20px; max-width: 1200px; margin: 0 auto; }
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 18px; position: relative; overflow: hidden; }
    .stat-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #FFD700, #FFF8DC); }
    .stat-icon { font-size: 1.8rem; margin-bottom: 8px; }
    .stat-value { font-family: 'Playfair Display', serif; font-size: 1.6rem; color: #FFD700; font-weight: 700; }
    .stat-label { color: #B8B8B8; font-size: 0.8rem; margin-top: 4px; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #FFD700; margin-bottom: 15px; }
    .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .action-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.3); border-radius: 12px; padding: 25px 15px; text-align: center; cursor: pointer; text-decoration: none; color: #FFF8DC; display: block; transition: all 0.3s; }
    .action-card:hover { transform: translateY(-5px); border-color: #FFD700; box-shadow: 0 10px 30px rgba(255,215,0,0.2); }
    .action-icon { font-size: 2rem; margin-bottom: 10px; }
    .action-name { font-weight: 600; font-size: 0.9rem; }
    .recent-list { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 15px; max-height: 300px; overflow-y: auto; }
    .recent-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,215,0,0.1); font-size: 0.9rem; }
    .recent-item:last-child { border-bottom: none; }
    .empty-state { text-align: center; padding: 30px; color: #B8B8B8; }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">SRJ Software</div>
    <div style="display: flex; align-items: center; gap: 15px;">
      <div class="sync-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">Online</span>
      </div>
      <button class="install-btn" id="installBtn">📲 Install</button>
    </div>
  </div>

  <div class="sw-nav">
    <button class="nav-btn active" onclick="window.location.href='index.html'">🏠 Dashboard</button>
    <button class="nav-btn" onclick="window.location.href='sales.html'">💰 Sales</button>
    <button class="nav-btn" onclick="window.location.href='stock.html'">📦 Stock</button>
    <button class="nav-btn" onclick="window.location.href='customers.html'">👥 Customers</button>
    <button class="nav-btn" onclick="window.location.href='reports.html'">📊 Reports</button>
    <button class="nav-btn" onclick="window.location.href='settings.html'">⚙️ Settings</button>
  </div>

  <div class="sw-content">
    <h2 class="section-title">Dashboard</h2>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon">💰</div>
        <div class="stat-value" id="todaySales">Rs 0</div>
        <div class="stat-label">Today's Sales</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📊</div>
        <div class="stat-value" id="monthSales">Rs 0</div>
        <div class="stat-label">This Month</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">👥</div>
        <div class="stat-value" id="totalCustomers">0</div>
        <div class="stat-label">Customers</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">📦</div>
        <div class="stat-value" id="stockItems">0</div>
        <div class="stat-label">Stock Items</div>
      </div>
    </div>

    <h2 class="section-title">Quick Actions</h2>
    <div class="action-grid">
      <a href="sales.html" class="action-card">
        <div class="action-icon">💰</div>
        <div class="action-name">New Sale</div>
      </a>
      <a href="stock.html" class="action-card">
        <div class="action-icon">📦</div>
        <div class="action-name">Add Stock</div>
      </a>
      <a href="customers.html" class="action-card">
        <div class="action-icon">👤</div>
        <div class="action-name">Add Customer</div>
      </a>
      <a href="reports.html" class="action-card">
        <div class="action-icon">📊</div>
        <div class="action-name">Reports</div>
      </a>
    </div>

    <h2 class="section-title">Recent Sales</h2>
    <div class="recent-list" id="recentSales">
      <div class="empty-state">No sales yet. Start by adding a sale!</div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js')
        .then(() => console.log('✅ SW registered'))
        .catch(err => console.error('SW error:', err));
    }
    
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById('installBtn').classList.add('show');
    });
    
    document.getElementById('installBtn')?.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') {
          document.getElementById('installBtn').classList.remove('show');
        }
        deferredPrompt = null;
      }
    });
    
    function updateOnlineStatus() {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (navigator.onLine) {
        dot.classList.remove('offline');
        text.textContent = 'Online';
      } else {
        dot.classList.add('offline');
        text.textContent = 'Offline';
      }
    }
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    updateOnlineStatus();
  </script>

</body>
</html>
