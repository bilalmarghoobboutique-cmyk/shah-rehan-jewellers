<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#FFD700">
  <title>Reports – SRJ Software</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { background: #0A0A0A; color: #FFF8DC; font-family: 'Poppins', sans-serif; }
    .sw-header { background: #1C1C1C; border-bottom: 2px solid #FFD700; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .sw-logo { font-family: 'Playfair Display', serif; color: #FFD700; font-weight: 700; }
    .sw-nav { display: flex; gap: 5px; padding: 10px 15px; background: #1C1C1C; overflow-x: auto; }
    .nav-btn { padding: 10px 20px; background: transparent; border: 1px solid rgba(255,215,0,0.3); color: #FFF8DC; border-radius: 50px; cursor: pointer; white-space: nowrap; }
    .nav-btn.active { background: #FFD700; color: #0A0A0A; }
    .sw-content { padding: 20px; max-width: 1000px; margin: 0 auto; }
    .section-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #FFD700; margin-bottom: 15px; }
    .report-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .report-card { background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 20px; }
    .report-label { color: #B8B8B8; font-size: 0.85rem; margin-bottom: 8px; }
    .report-value { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: #FFD700; font-weight: 700; }
  </style>
</head>
<body>

  <div class="sw-header">
    <div class="sw-logo">Reports</div>
    <button onclick="window.location.href='index.html'" style="background: transparent; color: #FFD700; border: 1px solid #FFD700; padding: 6px 15px; border-radius: 50px; cursor: pointer;">← Back</button>
  </div>

  <div class="sw-nav">
    <button class="nav-btn" onclick="window.location.href='index.html'">🏠 Dashboard</button>
    <button class="nav-btn" onclick="window.location.href='sales.html'">💰 Sales</button>
    <button class="nav-btn" onclick="window.location.href='stock.html'">📦 Stock</button>
    <button class="nav-btn" onclick="window.location.href='customers.html'">👥 Customers</button>
    <button class="nav-btn active">📊 Reports</button>
    <button class="nav-btn" onclick="window.location.href='settings.html'">⚙️ Settings</button>
  </div>

  <div class="sw-content">
    <h2 class="section-title">Business Reports</h2>

    <div class="report-grid">
      <div class="report-card">
        <div class="report-label">Total Sales (All Time)</div>
        <div class="report-value" id="rTotalSales">Rs 0</div>
      </div>
      <div class="report-card">
        <div class="report-label">This Month</div>
        <div class="report-value" id="rMonthSales">Rs 0</div>
      </div>
      <div class="report-card">
        <div class="report-label">Total Transactions</div>
        <div class="report-value" id="rTransactions">0</div>
      </div>
      <div class="report-card">
        <div class="report-label">Customers</div>
        <div class="report-value" id="rCustomers">0</div>
      </div>
    </div>

    <h2 class="section-title">Sales Log</h2>
    <div id="reportsList" style="background: #1C1C1C; border: 1px solid rgba(255,215,0,0.2); border-radius: 12px; padding: 15px;">
      <div style="text-align: center; padding: 30px; color: #B8B8B8;">Loading...</div>
    </div>
  </div>

  <script src="db.js"></script>
  <script>
    function formatPKR(a) { return 'Rs ' + Math.round(a || 0).toLocaleString('en-PK'); }
    function formatDate(d) { return new Date(d).toLocaleDateString('en-PK', { day: '2-digit', month: 'short', year: 'numeric' }); }
    
    async function loadReports() {
      const sales = await getAllRecords('sales') || [];
      const customers = await getAllRecords('customers') || [];
      
      const total = sales.reduce((s, x) => s + (parseFloat(x.total) || 0), 0);
      const thisMonth = new Date().toISOString().slice(0, 7);
      const monthSales = sales.filter(s => s.date && s.date.startsWith(thisMonth))
        .reduce((s, x) => s + (parseFloat(x.total) || 0), 0);
      
      document.getElementById('rTotalSales').textContent = formatPKR(total);
      document.getElementById('rMonthSales').textContent = formatPKR(monthSales);
      document.getElementById('rTransactions').textContent = sales.length;
      document.getElementById('rCustomers').textContent = customers.length;
      
      const list = document.getElementById('reportsList');
      if (sales.length === 0) {
        list.innerHTML = '<div style="text-align: center; padding: 30px; color: #B8B8B8;">No sales yet</div>';
        return;
      }
      
      list.innerHTML = sales.slice(-30).reverse().map(s => `
        <div style="display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(255,215,0,0.1);">
          <div>
            <strong style="color: #FFD700;">${s.customer_name}</strong>
            <div style="font-size: 0.85rem; color: #B8B8B8;">${s.items_summary} • ${formatDate(s.date)}</div>
          </div>
          <div style="color: #FFD700; font-weight: 700;">${formatPKR(s.total)}</div>
        </div>
      `).join('');
    }
    
    document.addEventListener('DOMContentLoaded', async () => {
      await initDB();
      loadReports();
    });
  </script>
</body>
</html>
